<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work — Arif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDE7DA;--paper2:#E3DCCC;--ink:#1C1B18;--teal:#2B6E62;--clay:#B8492F;--line:rgba(28,27,24,0.16);}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:repeating-linear-gradient(0deg, rgba(28,27,24,0.035) 0px, rgba(28,27,24,0.035) 1px, transparent 1px, transparent 64px),repeating-linear-gradient(90deg, rgba(28,27,24,0.035) 0px, rgba(28,27,24,0.035) 1px, transparent 1px, transparent 64px),var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;color:var(--teal);margin:0 0 14px;}
.nav{display:flex;justify-content:space-between;align-items:center;padding:26px 6vw;}
.logo{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:600;}
.logo .dot{color:var(--clay);}
.links{display:flex;gap:28px;font-family:'JetBrains Mono',monospace;font-size:0.78rem;letter-spacing:0.05em;text-transform:uppercase;}
.links a{opacity:0.65;border-bottom:1px solid transparent;padding-bottom:3px;transition:opacity .2s, border-color .2s;}
.links a:hover, .links a.active{opacity:1;border-color:var(--clay);}
.page-head{padding:40px 6vw 20px;max-width:1300px;margin:0 auto;}
.page-head h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(2.2rem,4.6vw,3.4rem);margin:0 0 20px;}
.link-pills{display:flex;flex-wrap:wrap;gap:12px;}
.link-pill{font-family:'JetBrains Mono',monospace;font-size:0.72rem;letter-spacing:0.04em;text-transform:uppercase;padding:9px 18px;border:1px solid var(--ink);border-radius:999px;transition:transform .15s ease, border-color .2s ease, color .2s ease;}
.link-pill:hover{transform:translateY(-2px);border-color:var(--clay);color:var(--clay);}
.grid-wrap{padding:30px 6vw 100px;max-width:1300px;margin:0 auto;}
.folder{border:1px solid var(--line);margin-bottom:22px;background:rgba(255,255,255,0.14);}
.folder>summary{list-style:none;cursor:pointer;padding:18px 22px;display:flex;align-items:center;gap:14px;user-select:none;}
.folder>summary::-webkit-details-marker{display:none;}
.folder-icon{width:20px;height:16px;flex-shrink:0;color:var(--teal);}
.fname{font-family:'Fraunces',serif;font-size:1.2rem;color:var(--ink);}
.fcount{font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.06em;color:var(--teal);margin-left:auto;text-transform:uppercase;}
.fchevron{font-family:'JetBrains Mono',monospace;color:#8a8578;transition:transform .2s;}
.folder[open]>summary{border-bottom:1px solid var(--line);}
.folder[open]>summary .fchevron{transform:rotate(90deg);}
.folder .cards{padding:26px 22px;display:flex;flex-direction:column;gap:40px;}
.gallery-block{}
.gallery-head{margin-bottom:16px;}
.card-meta{font-family:'JetBrains Mono',monospace;font-size:0.68rem;letter-spacing:0.08em;color:var(--teal);margin:0 0 6px;}
.gallery-head h3{font-family:'Fraunces',serif;font-weight:500;font-size:1.3rem;margin:0 0 8px;}
.gallery-head p{font-size:0.92rem;color:#4a473f;line-height:1.5;margin:0;max-width:60ch;}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.gallery-thumb{border:1px solid var(--line);padding:0;background:var(--paper2);cursor:zoom-in;aspect-ratio:4/3;overflow:hidden;display:block;}
.gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease;}
.gallery-thumb:hover img{transform:scale(1.06);}
.empty-note{font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:#8a8578;}

.lightbox{position:fixed;inset:0;background:rgba(28,27,24,0.92);display:flex;align-items:center;justify-content:center;z-index:100;}
.lightbox[hidden]{display:none;}
.lightbox img{max-width:88vw;max-height:82vh;object-fit:contain;border:1px solid rgba(255,255,255,0.15);}
.lb-btn{position:absolute;background:none;border:1px solid var(--paper);color:var(--paper);font-family:'JetBrains Mono',monospace;cursor:pointer;padding:10px 14px;transition:background .2s,color .2s;}
.lb-btn:hover{background:var(--paper);color:var(--ink);}
.lb-close{top:26px;right:6vw;font-size:1rem;}
.lb-prev{left:6vw;top:50%;transform:translateY(-50%);font-size:1.2rem;}
.lb-next{right:6vw;top:50%;transform:translateY(-50%);font-size:1.2rem;}
.lb-count{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--paper);letter-spacing:0.05em;}
@media(max-width:700px){.lb-prev,.lb-next{padding:8px 10px;}.lb-close{right:20px;top:16px;}}
.foot{display:flex;justify-content:space-between;padding:28px 6vw 40px;font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:#8a8578;border-top:1px solid var(--line);}
.foot-links a{margin-left:16px;opacity:0.8;}
.foot-links a:hover{color:var(--clay);opacity:1;}
.hud{position:fixed;bottom:20px;right:20px;font-family:'JetBrains Mono',monospace;font-size:0.68rem;background:rgba(237,231,218,0.85);border:1px solid var(--line);padding:6px 10px;letter-spacing:0.04em;color:var(--teal);backdrop-filter:blur(2px);z-index:10;}
@media (max-width:820px){.cards{grid-template-columns:1fr;}.hud{display:none;}.nav{flex-direction:column;gap:14px;text-align:center;}.foot{flex-direction:column;gap:10px;text-align:center;}.foot-links a{margin:0 8px;}}
</style>
</head>
<body>

<header class="nav">
  <a href="index.html" class="logo">Arif Aqmar<span class="dot">.</span></a>
  <nav class="links">
    <a href="index.html">Home</a>
    <a href="work.html" class="active">Work</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="page-head">
  <p class="eyebrow">SELECTED WORK</p>
  <h1>Things I've made.</h1>
  <div class="link-pills" id="linkPills"></div>
</section>

<section class="grid-wrap">
  <div id="folders">
    <p class="empty-note">Projects will appear here once added to assets/data.js.</p>
  </div>
</section>

<footer class="foot">
  <span>© 2026 Arif</span>
  <span class="foot-links"><a href="work.html">Work</a><a href="about.html">About</a><a href="contact.html">Contact</a></span>
</footer>

<div class="hud" id="hud">X <span id="hx">000</span> &nbsp; Y <span id="hy">000</span></div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close">CLOSE ✕</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous image">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next image">›</button>
  <p class="lb-count" id="lbCount"></p>
</div>

<script src="assets/data.js"></script>
<script>
(function(){
  function loadLinks(){
    var wrap = document.getElementById('linkPills');
    LINKS.forEach(function(l){
      var a = document.createElement('a');
      a.href = l.url;
      a.className = 'link-pill';
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = l.label || l.url;
      wrap.appendChild(a);
    });
  }
  loadLinks();

  var hx = document.getElementById('hx');
  var hy = document.getElementById('hy');
  if(hx && hy){
    window.addEventListener('mousemove', function(e){
      hx.textContent = String(Math.round(e.clientX)).padStart(3,'0');
      hy.textContent = String(Math.round(e.clientY)).padStart(3,'0');
    });
  }

  var FOLDER_ICON = '<svg class="folder-icon" viewBox="0 0 24 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 3.5C1 2.4 1.9 1.5 3 1.5H9L11.5 4H21C22.1 4 23 4.9 23 6V14.5C23 15.6 22.1 16.5 21 16.5H3C1.9 16.5 1 15.6 1 14.5V3.5Z"/></svg>';

  function slugify(s){
    return (s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'uncategorized';
  }

  // ---- Lightbox ----
  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCount = document.getElementById('lbCount');
  var lbImages = [];
  var lbIndex = 0;

  function openLightbox(images, index){
    lbImages = images;
    lbIndex = index;
    renderLightbox();
    lightbox.hidden = false;
  }
  function renderLightbox(){
    lbImg.src = lbImages[lbIndex];
    lbCount.textContent = (lbIndex + 1) + ' / ' + lbImages.length;
  }
  function closeLightbox(){ lightbox.hidden = true; lbImg.src = ''; }
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', function(){
    lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length;
    renderLightbox();
  });
  document.getElementById('lbNext').addEventListener('click', function(){
    lbIndex = (lbIndex + 1) % lbImages.length;
    renderLightbox();
  });
  lightbox.addEventListener('click', function(e){ if(e.target === lightbox) closeLightbox(); });
  window.addEventListener('keydown', function(e){
    if(lightbox.hidden) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') document.getElementById('lbPrev').click();
    if(e.key === 'ArrowRight') document.getElementById('lbNext').click();
  });

  function buildGallery(d){
    var block = document.createElement('div');
    block.className = 'gallery-block';

    var head = document.createElement('div');
    head.className = 'gallery-head';
    var meta = document.createElement('p');
    meta.className = 'card-meta';
    meta.textContent = [d.medium, d.year].filter(Boolean).join(' · ');
    head.appendChild(meta);
    var h3 = document.createElement('h3');
    h3.textContent = d.title || '(untitled)';
    head.appendChild(h3);
    if(d.description){
      var p = document.createElement('p');
      p.textContent = d.description;
      head.appendChild(p);
    }
    block.appendChild(head);

    var images = d.images || [];
    var grid = document.createElement('div');
    grid.className = 'gallery-grid';
    images.forEach(function(src, i){
      var btn = document.createElement('button');
      btn.className = 'gallery-thumb';
      btn.type = 'button';
      var img = document.createElement('img');
      img.src = src;
      img.alt = d.title || '';
      img.loading = 'lazy';
      btn.appendChild(img);
      btn.addEventListener('click', function(){ openLightbox(images, i); });
      grid.appendChild(btn);
    });
    block.appendChild(grid);

    return block;
  }

  function load(){
    var wrap = document.getElementById('folders');
    if(!PROJECTS.length){
      wrap.innerHTML = '<p class="empty-note">Projects will appear here once added to assets/data.js.</p>';
      return;
    }

    var groups = {};
    var order = [];
    PROJECTS.forEach(function(p){
      var key = (p.medium || '').trim() || 'Uncategorized';
      if(!groups[key]){ groups[key] = []; order.push(key); }
      groups[key].push(p);
    });
    order.sort(function(a,b){
      if(a === 'Uncategorized') return 1;
      if(b === 'Uncategorized') return -1;
      return a.localeCompare(b);
    });

    wrap.innerHTML = '';
    order.forEach(function(key, i){
      var items = groups[key];
      var slug = 'folder-' + slugify(key);
      var details = document.createElement('details');
      details.className = 'folder';
      details.id = slug;
      if(i === 0) details.open = true;

      var summary = document.createElement('summary');
      summary.innerHTML = FOLDER_ICON + '<span class="fname">' + key + '</span><span class="fcount">' + items.length + (items.length === 1 ? ' PIECE' : ' PIECES') + '</span><span class="fchevron">›</span>';
      details.appendChild(summary);

      var cardsWrap = document.createElement('div');
      cardsWrap.className = 'cards';
      items.forEach(function(d){ cardsWrap.appendChild(buildGallery(d)); });
      details.appendChild(cardsWrap);

      wrap.appendChild(details);
    });

    if(location.hash){
      var target = document.getElementById(location.hash.slice(1));
      if(target){
        target.open = true;
        setTimeout(function(){ target.scrollIntoView({behavior:'smooth', block:'start'}); }, 50);
      }
    }
  }
  load();
})();
</script>
</body>
</html>
